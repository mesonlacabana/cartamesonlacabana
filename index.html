<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Cabaña - Carta</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;color:#2a1f0e;font-family:'EB Garamond',Georgia,serif;min-height:100vh}
.page{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.header{text-align:center;padding:1.5rem 1rem 1.5rem;border-bottom:2px solid #8b6914;margin-bottom:2rem}
.header::before,.header::after{content:'';display:block;height:1px;background:#8b6914;margin:0.5rem auto;width:60%}
.logo-img{width:200px;height:auto;margin:0 auto 0.4rem;display:block}
.restaurant-type{font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.3em;color:#8b6914;text-transform:uppercase}
.section{margin-bottom:2.2rem}
.section-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:#8b6914;letter-spacing:0.25em;text-align:center;text-transform:uppercase;margin-bottom:0.8rem;padding-bottom:0.5rem;border-bottom:1px solid #c9a84c;position:relative}
.section-title::after{content:'';display:block;width:40px;height:2px;background:#8b6914;margin:0.4rem auto 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 2.5rem}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.menu-item{display:flex;justify-content:space-between;align-items:baseline;padding:0.38rem 0.3rem;border-bottom:1px dotted #c9a84c55;font-size:1.05rem}
.menu-item:last-child{border-bottom:none}
.item-name{flex:1;padding-right:1rem;font-style:italic;color:#2a1f0e}
.item-desc{font-size:0.82rem;color:#6b4f2a;font-style:normal;display:block;margin-top:1px}
.item-price{font-family:'Cinzel',serif;font-size:0.95rem;font-weight:600;color:#4a2c0a;white-space:nowrap;min-width:52px;text-align:right}
.salsas-block{background:#f0e8d0;border:1px solid #c9a84c55;border-radius:6px;padding:0.8rem 1.2rem;margin-top:1rem}
.salsas-label{font-family:'Cinzel',serif;font-size:0.75rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.3rem}
.salsas-list{font-style:italic;font-size:1rem;color:#2a1f0e;margin-bottom:0.2rem}
.salsas-price{font-family:'Cinzel',serif;font-size:0.9rem;color:#4a2c0a;text-align:right}
.hr{border:none;border-top:1px solid #c9a84c44;margin:1.8rem 0}
.asterisk{color:#8b6914;margin-right:3px}
.bread-bar{text-align:right;font-size:0.9rem;font-style:italic;color:#6b4f2a;border-top:1px solid #c9a84c;margin-top:1.5rem;padding-top:0.5rem}
.loading{text-align:center;font-family:'Cinzel',serif;color:#8b6914;letter-spacing:0.2em;padding:3rem;font-size:0.9rem}
.error{text-align:center;color:#a32d2d;padding:2rem;font-style:italic}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img id="logo" class="logo-img" alt="Logo La Cabaña">
    <div class="restaurant-type">Mesón · Restaurante &nbsp;·&nbsp; Salón de Celebraciones</div>
  </div>
  <div id="carta-container"><div class="loading">Cargando carta...</div></div>
  <div class="bread-bar">* Cesta de pan &nbsp;&nbsp; 1,50 €</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://ycevaztpxjfnbwjmojhx.supabase.co'
const SUPABASE_KEY = 'sb_publishable_qVRqDvEojdSXXFogpx6iHA_oDn1L0R1'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

const SALSAS_ALTAS = {
  'Entrantes y Primeros': true,
  'Pescados': true,
  'Carnes': true
}
const SALSAS_TEXTO_ALTA = '* Pimienta · * Roquefort · * Ajo tostado · * Salsa verde · * Mojo picón'
const SALSAS_TEXTO_BAJA = '* Pimienta · * Roquefort · * Ajo tostado · * Salsa verde'

function salsasHTML(seccion) {
  const alta = SALSAS_ALTAS[seccion]
  if (seccion === 'Postres') return ''
  return `<div class="salsas-block">
    <div class="salsas-label">Salsas</div>
    <div class="salsas-list">${alta ? SALSAS_TEXTO_ALTA : SALSAS_TEXTO_BAJA}</div>
    <div class="salsas-price">${alta ? '2,00' : '0,50'} €</div>
  </div>`
}

function precioHTML(precio) {
  if (precio === null || precio === undefined) return ''
  return Number(precio).toFixed(2).replace('.', ',')
}

function renderCarta(items) {
  const grupos = {}
  const orden = ['Entrantes y Primeros','Pescados','Carnes','Bocadillos','Pizzas','Patatas','Postres']
  for (const item of items) {
    if (!grupos[item.seccion]) grupos[item.seccion] = []
    grupos[item.seccion].push(item)
  }

  let html = ''
  const secciones = orden.filter(s => grupos[s])

  secciones.forEach((sec, i) => {
    const mitad = Math.ceil(grupos[sec].length / 2)
    const col1 = grupos[sec].slice(0, mitad)
    const col2 = grupos[sec].slice(mitad)

    const colHTML = col => col.map(item => `
      <div class="menu-item">
        <span class="item-name">
          <span class="asterisk">*</span>${item.nombre}
          ${item.descripcion ? `<span class="item-desc">${item.descripcion}</span>` : ''}
        </span>
        <span class="item-price">${precioHTML(item.precio)}</span>
      </div>`).join('')

    html += `
      <div class="section">
        <div class="section-title">${sec}</div>
        <div class="two-col">
          <div>${colHTML(col1)}</div>
          <div>${colHTML(col2)}</div>
        </div>
        ${salsasHTML(sec)}
      </div>
      ${i < secciones.length - 1 ? '<hr class="hr">' : ''}`
  })

  document.getElementById('carta-container').innerHTML = html
}

// Logo
const logoEl = document.getElementById('logo')
const stored = sessionStorage.getItem('lacabana_logo')
if (stored) {
  logoEl.src = stored
} else {
  const fi = document.createElement('input')
  fi.type = 'file'; fi.accept = 'image/*'; fi.style.display = 'none'
  document.body.appendChild(fi)
  logoEl.style.cssText = 'cursor:pointer;border:2px dashed #c9a84c;border-radius:8px;padding:8px;width:180px;height:60px;object-fit:contain'
  logoEl.title = 'Haz clic para cargar el logo'
  logoEl.addEventListener('click', () => fi.click())
  fi.addEventListener('change', e => {
    const r = new FileReader()
    r.onload = ev => {
      logoEl.src = ev.target.result
      logoEl.style.cssText = 'width:200px;height:auto;margin:0 auto 0.4rem;display:block'
      sessionStorage.setItem('lacabana_logo', ev.target.result)
    }
    r.readAsDataURL(e.target.files[0])
  })
}

// Cargar carta desde Supabase
try {
  const { data, error } = await supabase
    .from('carta')
    .select('*')
    .order('id')

  if (error) throw error
  if (!data || data.length === 0) {
    document.getElementById('carta-container').innerHTML = '<div class="error">No se encontraron productos en la base de datos.</div>'
  } else {
    renderCarta(data)
  }
} catch (err) {
  document.getElementById('carta-container').innerHTML = `<div class="error">Error al conectar con la base de datos: ${err.message}</div>`
}
</script>
</body>
</html>
