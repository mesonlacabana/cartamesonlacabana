<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos - La Cabaña</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;color:#2a1f0e;font-family:'EB Garamond',Georgia,serif;font-size:15px}
/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#4a2c0a;color:#f5f0e8;display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1.2rem;gap:1rem}
.topbar-title{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:0.1em}
.topbar-sub{font-family:'Cinzel',serif;font-size:0.65rem;color:#c9a84c;letter-spacing:0.2em;text-transform:uppercase}
.btn-new{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.1em;background:#8b6914;color:#f5f0e8;border:none;padding:0.45rem 1rem;border-radius:6px;cursor:pointer}
.btn-new:hover{background:#c9a84c;color:#2a1f0e}
.main{display:flex;flex:1;gap:0;overflow:hidden}
/* SIDEBAR CALENDAR */
.sidebar{width:300px;min-width:280px;background:#fff;border-right:1px solid #c9a84c44;display:flex;flex-direction:column;overflow-y:auto}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1rem;border-bottom:1px solid #c9a84c44}
.cal-title{font-family:'Cinzel',serif;font-size:0.85rem;color:#4a2c0a;letter-spacing:0.1em}
.cal-nav{background:none;border:none;color:#8b6914;cursor:pointer;font-size:1.1rem;padding:0 0.3rem}
.cal-grid{padding:0.5rem 0.8rem 0.8rem}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-day-name{font-family:'Cinzel',serif;font-size:0.6rem;color:#8b6914;text-align:center;letter-spacing:0.05em;padding:3px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{min-height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 2px;cursor:default;position:relative;font-size:0.82rem}
.cal-day.other-month{color:#ccc}
.cal-day.today{background:#f0e8d0;font-weight:600}
.cal-day.has-event{cursor:pointer;background:#fdf6e3;border:1px solid #c9a84c88}
.cal-day.has-event:hover{background:#f0e8d0}
.cal-day.selected{background:#4a2c0a!important;color:#f5f0e8!important}
.cal-day.selected .event-dot{background:#c9a84c!important}
.event-dot{width:5px;height:5px;border-radius:50%;background:#8b6914;margin-top:2px}
.event-list{padding:0.5rem 0.8rem;border-top:1px solid #c9a84c22}
.event-list-title{font-family:'Cinzel',serif;font-size:0.68rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.5rem}
.event-item{padding:0.45rem 0.6rem;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid #c9a84c44;background:#faf7f0}
.event-item:hover{background:#f0e8d0}
.event-item.active{background:#4a2c0a;color:#f5f0e8;border-color:#4a2c0a}
.event-item.active .ev-sub{color:#c9a84c}
.ev-name{font-size:0.88rem;font-weight:500}
.ev-sub{font-size:0.75rem;color:#8b6914;font-style:italic}
/* CONTENT */
.content{flex:1;overflow-y:auto;padding:1.5rem}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#8b6914;gap:1rem;opacity:0.7}
.empty-icon{font-size:3rem}
.empty-text{font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.2em}
/* TABS */
.tabs{display:flex;gap:2px;margin-bottom:1.2rem;flex-wrap:wrap;border-bottom:2px solid #c9a84c44;padding-bottom:0}
.tab{font-family:'Cinzel',serif;font-size:0.68rem;letter-spacing:0.1em;color:#8b6914;background:none;border:none;padding:0.5rem 0.9rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;text-transform:uppercase}
.tab:hover{color:#4a2c0a}
.tab.active{color:#4a2c0a;border-bottom-color:#8b6914;font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
/* CARDS */
.card{background:#fff;border:1px solid #c9a84c44;border-radius:10px;padding:1.2rem 1.5rem;margin-bottom:1rem}
.card-title{font-family:'Cinzel',serif;font-size:0.78rem;color:#8b6914;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid #c9a84c33}
/* FORM GRID */
.fg{display:grid;gap:0.8rem}
.fg-2{grid-template-columns:1fr 1fr}
.fg-3{grid-template-columns:1fr 1fr 1fr}
.fg-4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:700px){.fg-2,.fg-3,.fg-4{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:0.78rem;color:#6b4f2a;font-style:italic;margin-bottom:0.3rem}
.field input,.field select,.field textarea{width:100%;padding:0.45rem 0.65rem;border:1px solid #c9a84c88;border-radius:6px;font-size:0.95rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#8b6914}
.field textarea{resize:vertical;min-height:70px}
/* MENU SECTIONS */
.menu-section{margin-bottom:1rem}
.menu-section-title{font-family:'Cinzel',serif;font-size:0.72rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.5rem}
.menu-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.5rem}
.menu-tag{font-size:0.82rem;font-style:italic;background:#f0e8d0;border:1px solid #c9a84c66;border-radius:4px;padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.3rem}
.menu-tag .rm{cursor:pointer;color:#a32d2d;font-style:normal;font-size:0.75rem}
.menu-tag .rm:hover{color:#791f1f}
.add-item-row{display:flex;gap:0.4rem}
.add-item-row input,.add-item-row select{flex:1;padding:0.38rem 0.6rem;border:1px solid #c9a84c88;border-radius:6px;font-size:0.88rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.add-item-row input:focus,.add-item-row select:focus{border-color:#8b6914}
.btn-sm{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.08em;padding:0.38rem 0.8rem;border:none;border-radius:6px;cursor:pointer}
.btn-primary{background:#4a2c0a;color:#f5f0e8}.btn-primary:hover{background:#6b4f2a}
.btn-secondary{background:#f0e8d0;color:#4a2c0a;border:1px solid #c9a84c}.btn-secondary:hover{background:#e8dcc0}
.btn-danger{background:#791f1f;color:#f5f0e8}.btn-danger:hover{background:#a32d2d}
.btn-lg{padding:0.6rem 1.4rem;font-size:0.8rem}
/* FICHA COCINA */
.cocina-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cocina-block{background:#faf7f0;border:1px solid #c9a84c44;border-radius:8px;padding:0.8rem 1rem}
.cocina-block-title{font-family:'Cinzel',serif;font-size:0.7rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.6rem;border-bottom:1px dotted #c9a84c55;padding-bottom:0.4rem}
.cocina-item{font-size:0.9rem;font-style:italic;padding:0.2rem 0;border-bottom:1px dotted #c9a84c22}
.cocina-item:last-child{border:none}
.cocina-item .qty{font-family:'Cinzel',serif;font-size:0.75rem;color:#4a2c0a;font-style:normal;margin-left:0.4rem}
/* CONTRATO */
.contrato-body{font-size:0.92rem;line-height:1.8;color:#2a1f0e}
.contrato-body h2{font-family:'Cinzel',serif;font-size:1rem;text-align:center;margin-bottom:1rem;letter-spacing:0.1em}
.contrato-body .c-section{margin:1rem 0}
.contrato-body strong{font-family:'Cinzel',serif;font-size:0.8rem}
.contrato-precios{border:1px solid #c9a84c44;border-radius:8px;padding:0.8rem 1.2rem;margin:1rem 0;background:#faf7f0}
.c-row{display:flex;justify-content:space-between;padding:0.3rem 0;border-bottom:1px dotted #c9a84c33;font-size:0.9rem}
.c-row:last-child{border:none;font-weight:600;font-family:'Cinzel',serif;font-size:0.85rem}
.c-firmas{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2rem}
.c-firma{text-align:center;border-top:1px solid #2a1f0e;padding-top:0.5rem;font-size:0.85rem}
/* FACTURA */
.factura-header{display:flex;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.factura-from{font-size:0.88rem;line-height:1.7}
.factura-from strong{font-family:'Cinzel',serif;font-size:0.85rem;display:block;margin-bottom:0.3rem}
.factura-num{text-align:right;font-family:'Cinzel',serif;font-size:0.8rem;color:#8b6914;letter-spacing:0.1em}
.factura-table{width:100%;border-collapse:collapse;margin-bottom:1rem;font-size:0.9rem}
.factura-table th{font-family:'Cinzel',serif;font-size:0.65rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 0.6rem;border-bottom:1px solid #c9a84c;text-align:left}
.factura-table td{padding:0.45rem 0.6rem;border-bottom:1px dotted #c9a84c33;vertical-align:middle}
.factura-table tr:last-child td{border:none}
.factura-totals{display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem;font-size:0.9rem}
.factura-total-row{display:flex;gap:2rem;justify-content:flex-end}
.factura-total-row.grand{font-family:'Cinzel',serif;font-size:1rem;color:#4a2c0a;border-top:2px solid #8b6914;padding-top:0.4rem;margin-top:0.2rem}
.factura-total-label{min-width:160px;text-align:right;font-style:italic}
.factura-total-val{min-width:90px;text-align:right;font-weight:600}
/* MATERIAS PRIMAS */
.mp-table{width:100%;border-collapse:collapse;font-size:0.9rem}
.mp-table th{font-family:'Cinzel',serif;font-size:0.65rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 0.6rem;border-bottom:1px solid #c9a84c;text-align:left}
.mp-table td{padding:0.4rem 0.6rem;border-bottom:1px dotted #c9a84c33}
.mp-table tr:hover td{background:#faf7f0}
.mp-cat{font-family:'Cinzel',serif;font-size:0.7rem;color:#8b6914;letter-spacing:0.1em;text-transform:uppercase}
/* PRINT */
.print-btn{float:right;margin-top:-0.2rem}
@media print{.topbar,.sidebar,.tabs,.btn-sm,.btn-lg,.print-btn{display:none!important}.content{padding:0}.card{border:none;padding:0.5rem 0}}
/* TOAST */
#toast{position:fixed;bottom:1.2rem;right:1.2rem;background:#4a2c0a;color:#f5f0e8;font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.1em;padding:0.6rem 1.2rem;border-radius:8px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:9999}
#toast.show{opacity:1}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:1000;display:none}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:2rem;width:90%;max-width:500px;border:1px solid #c9a84c}
.modal-title{font-family:'Cinzel',serif;font-size:0.9rem;color:#4a2c0a;margin-bottom:1.2rem;letter-spacing:0.1em}
.modal-actions{display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1.2rem}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><div class="topbar-title">La Cabaña</div><div class="topbar-sub">Gestión de Eventos</div></div>
    <button class="btn-new" id="btn-nuevo-evento">+ Nuevo Evento</button>
  </div>
  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">&#8249;</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="cal-nav" id="cal-next">&#8250;</button>
      </div>
      <div class="cal-grid">
        <div class="cal-days-header" id="cal-days-header"></div>
        <div class="cal-days" id="cal-days"></div>
      </div>
      <div class="event-list">
        <div class="event-list-title">Eventos del mes</div>
        <div id="event-list-items"></div>
      </div>
    </div>
    <!-- CONTENT -->
    <div class="content" id="main-content">
      <div class="empty-state">
        <div class="empty-icon">🍽️</div>
        <div class="empty-text">Selecciona o crea un evento</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVO EVENTO -->
<div class="modal-bg" id="modal-nuevo">
  <div class="modal">
    <div class="modal-title">Nuevo Evento</div>
    <div class="fg fg-2" style="gap:0.8rem">
      <div class="field"><label>Nombre y Apellidos</label><input id="mn-nombre" placeholder="Nombre del cliente"></div>
      <div class="field"><label>Teléfono</label><input id="mn-tlf" placeholder="Teléfono"></div>
      <div class="field"><label>Tipo de Evento</label>
        <select id="mn-evento">
          <option>Comunión</option><option>Boda</option><option>Bautizo</option>
          <option>Cumpleaños</option><option>Aniversario</option><option>Otro</option>
        </select>
      </div>
      <div class="field"><label>Nombre del Evento</label><input id="mn-evento-nombre" placeholder="Ej: Comunión Erik"></div>
      <div class="field"><label>Fecha</label><input type="date" id="mn-fecha"></div>
      <div class="field"><label>Hora</label><input type="time" id="mn-hora" value="14:00"></div>
      <div class="field"><label>Nº Comensales</label><input type="number" id="mn-adultos" placeholder="0" min="0"></div>
      <div class="field"><label>Nº Niños</label><input type="number" id="mn-ninos" placeholder="0" min="0"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-sm btn-secondary" id="btn-modal-cancel">Cancelar</button>
      <button class="btn-sm btn-primary" id="btn-modal-save">Crear Evento</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb = createClient('https://ycevaztpxjfnbwjmojhx.supabase.co','sb_publishable_qVRqDvEojdSXXFogpx6iHA_oDn1L0R1')

// ── STATE ──
let eventos = []
let cartaItems = []
let currentEvento = null
let calYear, calMonth
const now = new Date()
calYear = now.getFullYear(); calMonth = now.getMonth()

// ── TOAST ──
function toast(msg, err=false) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.className = 'show' + (err?' err':'')
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 2600)
}

// ── LOAD ──
async function loadAll() {
  const [ev, carta] = await Promise.all([
    sb.from('eventos').select('*').order('fecha'),
    sb.from('carta').select('*').order('seccion,nombre')
  ])
  if (ev.data) eventos = ev.data
  if (carta.data) cartaItems = carta.data
  renderCal(); renderEventList()
}

// ── CALENDAR ──
const DAYS = ['L','M','X','J','V','S','D']
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']

function renderCal() {
  document.getElementById('cal-title').textContent = MONTHS[calMonth] + ' ' + calYear
  const hdr = document.getElementById('cal-days-header')
  hdr.innerHTML = DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('')
  const first = new Date(calYear, calMonth, 1)
  let startDow = first.getDay(); if(startDow===0) startDow=7
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate()
  const daysInPrev = new Date(calYear, calMonth, 0).getDate()
  const todayStr = now.toISOString().slice(0,10)
  const eventDays = new Set(eventos.filter(e=>e.fecha&&e.fecha.slice(0,7)===`${calYear}-${String(calMonth+1).padStart(2,'0')}`).map(e=>e.fecha.slice(8,10).replace(/^0/,'')))
  let html = ''
  for(let i=1;i<startDow;i++) html+=`<div class="cal-day other-month">${daysInPrev-startDow+1+i}</div>`
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const isToday=ds===todayStr, hasEv=eventDays.has(String(d))
    const isSel=currentEvento&&currentEvento.fecha===ds
    html+=`<div class="cal-day${isToday?' today':''}${hasEv?' has-event':''}${isSel?' selected':''}" data-date="${ds}">${d}${hasEv?'<div class="event-dot"></div>':''}</div>`
  }
  document.getElementById('cal-days').innerHTML = html
  document.querySelectorAll('.cal-day.has-event').forEach(el=>{
    el.addEventListener('click',()=>{
      const evs = eventos.filter(e=>e.fecha===el.dataset.date)
      if(evs.length===1) selectEvento(evs[0])
    })
  })
}

function renderEventList(filter=null) {
  const list = filter ? eventos.filter(e=>e.fecha&&e.fecha.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`)) : eventos.filter(e=>e.fecha&&e.fecha.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`))
  const el = document.getElementById('event-list-items')
  if(!list.length){el.innerHTML='<div style="font-size:0.82rem;color:#aaa;font-style:italic;padding:0.3rem 0">Sin eventos este mes</div>';return}
  el.innerHTML = list.map(e=>`
    <div class="event-item${currentEvento&&currentEvento.id===e.id?' active':''}" data-id="${e.id}">
      <div class="ev-name">${e.evento_nombre||e.tipo_evento||'Evento'}</div>
      <div class="ev-sub">${e.nombre_cliente||''} · ${e.fecha||''}</div>
    </div>`).join('')
  el.querySelectorAll('.event-item').forEach(el2=>{
    el2.addEventListener('click',()=>{
      const ev=eventos.find(e=>e.id==el2.dataset.id)
      if(ev) selectEvento(ev)
    })
  })
}

document.getElementById('cal-prev').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCal();renderEventList()}
document.getElementById('cal-next').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCal();renderEventList()}

// ── SELECT EVENTO ──
function selectEvento(ev) {
  currentEvento = ev
  renderCal(); renderEventList()
  renderEventoDetail(ev)
}

// ── DETAIL ──
const TABS = [
  {id:'ficha',label:'Ficha Cliente'},
  {id:'menu',label:'Menú'},
  {id:'cocina',label:'Ficha Cocina'},
  {id:'reserva',label:'Reserva'},
  {id:'contrato',label:'Contrato'},
  {id:'factura',label:'Factura'},
  {id:'materias',label:'Materias Primas'},
]

let activeTab = 'ficha'

function renderEventoDetail(ev) {
  const mc = document.getElementById('main-content')
  mc.innerHTML = `
    <div class="tabs" id="tabs-bar">
      ${TABS.map(t=>`<button class="tab${activeTab===t.id?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div id="tab-body"></div>`
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{activeTab=btn.dataset.tab;renderTabContent(ev)})
  })
  renderTabContent(ev)
}

function renderTabContent(ev) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))
  const body = document.getElementById('tab-body')
  switch(activeTab) {
    case 'ficha': body.innerHTML = tabFicha(ev); bindFicha(ev); break
    case 'menu': body.innerHTML = tabMenu(ev); bindMenu(ev); break
    case 'cocina': body.innerHTML = tabCocina(ev); break
    case 'reserva': body.innerHTML = tabReserva(ev); break
    case 'contrato': body.innerHTML = tabContrato(ev); break
    case 'factura': body.innerHTML = tabFactura(ev); bindFactura(ev); break
    case 'materias': body.innerHTML = tabMaterias(ev); break
  }
}

// ── TAB FICHA ──
function tabFicha(ev) {
  const m = ev.menu||{}
  return `<div class="card">
    <div class="card-title">Datos del Cliente</div>
    <div class="fg fg-2" style="gap:0.8rem">
      <div class="field"><label>Nombre y Apellidos</label><input id="f-nombre" value="${ev.nombre_cliente||''}"></div>
      <div class="field"><label>DNI</label><input id="f-dni" value="${ev.dni||''}"></div>
      <div class="field"><label>Dirección</label><input id="f-dir" value="${ev.direccion||''}"></div>
      <div class="field"><label>Teléfono</label><input id="f-tlf" value="${ev.telefono||''}"></div>
      <div class="field"><label>Salón / Servicio</label>
        <select id="f-salon">
          ${['Salón Principal','Salón Gargo','Catering','Terraza'].map(s=>`<option${ev.salon===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Tipo de Evento</label>
        <select id="f-tipo">
          ${['Comunión','Boda','Bautizo','Cumpleaños','Aniversario','Otro'].map(s=>`<option${ev.tipo_evento===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Nombre del Evento</label><input id="f-evnombre" value="${ev.evento_nombre||''}"></div>

function bindMenu(ev) {
  const m = getMenu(ev)
  function refreshTags(sec) {
    const items = m[sec]||[]
    document.getElementById('tags-'+sec).innerHTML = items.map(it=>`<span class="menu-tag">${it}<span class="rm" data-sec="${sec}" data-val="${it}">✕</span></span>`).join('')
    bindRemove()
  }
  function bindRemove() {
    document.querySelectorAll('.rm').forEach(el=>{
      el.onclick=()=>{
        const {sec,val}=el.dataset
        m[sec]=(m[sec]||[]).filter(x=>x!==val)
        refreshTags(sec)
      }
    })
  }
  bindRemove()
  document.querySelectorAll('.menu-add-btn').forEach(btn=>{
    btn.onclick=()=>{
      const sec=btn.dataset.sec
      const sel=document.querySelector(`.menu-carta-sel[data-sec="${sec}"]`)
      const inp=document.querySelector(`.menu-free-inp[data-sec="${sec}"]`)
      const val=(sel.value||inp.value).trim()
      if(!val) return
      if(!m[sec]) m[sec]=[]
      if(!m[sec].includes(val)) m[sec].push(val)
      sel.value=''; inp.value=''
      refreshTags(sec)
    }
  })
  document.getElementById('btn-save-menu').onclick = async () => {
    const {error} = await sb.from('eventos').update({menu_data: JSON.stringify(m)}).eq('id',ev.id)
    if(error){toast('Error al guardar',true);return}
    ev.menu_data = JSON.stringify(m)
    const idx=eventos.findIndex(e=>e.id===ev.id); if(idx>-1) eventos[idx].menu_data=ev.menu_data
    toast('Menú guardado')
  }
}

  function bindInputs() {
    document.querySelectorAll('.edit-input[data-fi]').forEach(inp=>{
      inp.oninput=()=>{
        const i=parseInt(inp.dataset.fi), k=inp.dataset.fk
        f.lineas[i][k] = k==='desc' ? inp.value : parseFloat(inp.value)||0
        if(k!=='desc') recalc()
        else { const base=f.lineas.reduce((s,l)=>s+l.qty*l.precio,0),iva=base*0.1,total=base+iva; document.getElementById('fac-totals').innerHTML=`<div class="factura-total-row"><span class="factura-total-label">Total</span><span class="factura-total-val">${base.toFixed(2)} €</span></div><div class="factura-total-row"><span class="factura-total-label">I.V.A. 10%</span><span class="factura-total-val">${iva.toFixed(2)} €</span></div><div class="factura-total-row grand"><span class="factura-total-label">Total Factura</span><span class="factura-total-val">${total.toFixed(2)} €</span></div>` }
      }
    })
    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick=()=>{ f.lineas.splice(parseInt(btn.dataset.del),1); recalc() }
    })
  }
  bindInputs()
  document.getElementById('btn-add-linea').onclick=()=>{ f.lineas.push({qty:1,desc:'',precio:0}); rerender() }
  document.getElementById('btn-save-factura').onclick = async () => {
    f.num_factura = document.getElementById('fac-num').value
    const {error} = await sb.from('eventos').update({factura_data:JSON.stringify(f)}).eq('id',ev.id)
    if(error){toast('Error',true);return}
    ev.factura_data = JSON.stringify(f)
    toast('Factura guardada')
  }
  const savePreciosBtn = document.getElementById('btn-save-precios')
  if(savePreciosBtn) savePreciosBtn.onclick = async () => {
    const pa=parseFloat(document.getElementById('c-pa').value)||0
    const pn=parseFloat(document.getElementById('c-pn').value)||0
    await sb.from('eventos').update({precio_adulto:pa,precio_nino:pn}).eq('id',ev.id)
    ev.precio_adulto=pa; ev.precio_nino=pn; toast('Precios guardados')
  }
}

function tabMaterias(ev) {
  const m = getMenu(ev)
  const adultos = ev.num_adultos||0, ninos = ev.num_ninos||0
  const allItems = []
  const allSecs = [...MENU_SECTIONS,...MENU_NINOS_SECTIONS]
  for(const s of allSecs) {
    const isNinos = s.key.startsWith('ninos_')
    const n = isNinos ? ninos : adultos
    for(const item of (m[s.key]||[])) {
      const mp = MP[item]
      if(mp) allItems.push({...mp, item, n, total: mp.qty * n})
      else allItems.push({cat:'Sin datos',ing:item,u:'—',qty:0,item,n,total:0})
    }
  }
  // Agrupar por ingrediente
  const agg = {}
  for(const x of allItems) {
    const k = x.ing+'|||'+x.u+'|||'+x.cat
    if(!agg[k]) agg[k]={cat:x.cat,ing:x.ing,u:x.u,total:0,items:[]}
    agg[k].total += x.total
    agg[k].items.push(x.item)
  }
  const cats = {}
  for(const v of Object.values(agg)) {
    if(!cats[v.cat]) cats[v.cat]=[]
    cats[v.cat].push(v)
  }
  let html = `<div class="card">
    <div class="card-title">Materias Primas Necesarias — ${adultos} adultos + ${ninos} niños</div>
    <table class="mp-table">
      <thead><tr><th>Categoría</th><th>Ingrediente</th><th>Platos que lo usan</th><th style="text-align:right">Cantidad total</th></tr></thead>
      <tbody>`
  for(const [cat, items] of Object.entries(cats).sort()) {
    for(const x of items.sort((a,b)=>a.ing.localeCompare(b.ing))) {
      html+=`<tr>
        <td class="mp-cat">${cat}</td>
        <td style="font-style:italic">${x.ing}</td>
        <td style="font-size:0.82rem;color:#6b4f2a">${[...new Set(x.items)].join(', ')}</td>
        <td style="text-align:right;font-family:'Cinzel',serif;font-weight:600">${x.u==='kg'?(x.total<1?(x.total*1000).toFixed(0)+' g':x.total.toFixed(2)+' kg'):x.total.toFixed(0)+' '+x.u}</td>
      </tr>`
    }
  }
  if(!allItems.length) html+=`<tr><td colspan="4" style="text-align:center;font-style:italic;color:#aaa;padding:1rem">Sin productos en el menú todavía</td></tr>`
  html+=`</tbody></table></div>`
  return html
}
