<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - La Cabaña</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;color:#2a1f0e;font-family:'EB Garamond',Georgia,serif;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-card{background:#fff;border:1px solid #c9a84c;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px #8b691422}
.login-title{font-family:'Cinzel',serif;color:#4a2c0a;font-size:1.3rem;text-align:center;margin-bottom:0.3rem}
.login-sub{font-family:'Cinzel',serif;color:#8b6914;font-size:0.72rem;letter-spacing:0.2em;text-align:center;margin-bottom:2rem;text-transform:uppercase}
.field{margin-bottom:1.2rem}
.field label{display:block;font-size:0.9rem;color:#6b4f2a;margin-bottom:0.4rem;font-style:italic}
.field input{width:100%;padding:0.6rem 0.8rem;border:1px solid #c9a84c88;border-radius:6px;font-size:1rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.field input:focus{border-color:#8b6914}
.btn-login{width:100%;padding:0.75rem;background:#4a2c0a;color:#f5f0e8;font-family:'Cinzel',serif;font-size:0.9rem;letter-spacing:0.15em;border:none;border-radius:6px;cursor:pointer;margin-top:0.5rem}
.btn-login:hover{background:#6b4f2a}
.login-err{color:#a32d2d;font-size:0.88rem;text-align:center;margin-top:0.8rem;font-style:italic;min-height:1.2rem}

/* ADMIN */
#admin-screen{display:none;max-width:960px;margin:0 auto;padding:1.5rem}
.admin-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #8b6914;padding-bottom:1rem;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem}
.admin-title{font-family:'Cinzel',serif;color:#4a2c0a;font-size:1.3rem}
.admin-sub{font-family:'Cinzel',serif;color:#8b6914;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase}
.btn-logout{font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.1em;color:#8b6914;background:none;border:1px solid #c9a84c;padding:0.4rem 0.9rem;border-radius:6px;cursor:pointer}
.btn-logout:hover{background:#f0e8d0}

/* ADD FORM */
.add-form{background:#fff;border:1px solid #c9a84c55;border-radius:10px;padding:1.2rem 1.5rem;margin-bottom:1.8rem}
.add-form-title{font-family:'Cinzel',serif;font-size:0.8rem;color:#8b6914;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1rem}
.form-row{display:grid;grid-template-columns:1fr 1.5fr 0.6fr auto;gap:0.6rem;align-items:end}
@media(max-width:600px){.form-row{grid-template-columns:1fr 1fr;}}
.form-group label{display:block;font-size:0.82rem;color:#6b4f2a;font-style:italic;margin-bottom:0.3rem}
.form-group input,.form-group select{width:100%;padding:0.5rem 0.7rem;border:1px solid #c9a84c88;border-radius:6px;font-size:0.95rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#8b6914}
.btn-add{padding:0.52rem 1.2rem;background:#4a2c0a;color:#f5f0e8;font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.1em;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;height:36px}
.btn-add:hover{background:#6b4f2a}
.btn-add:disabled{opacity:0.5;cursor:not-allowed}

/* FILTER */
.filter-row{display:flex;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-row select{padding:0.45rem 0.7rem;border:1px solid #c9a84c88;border-radius:6px;font-size:0.95rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.filter-row select:focus{border-color:#8b6914}
.count-badge{font-family:'Cinzel',serif;font-size:0.72rem;color:#8b6914;letter-spacing:0.1em;margin-left:auto}

/* TABLE */
.table-wrap{background:#fff;border:1px solid #c9a84c55;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:0.97rem}
thead tr{background:#f0e8d0}
th{font-family:'Cinzel',serif;font-size:0.72rem;color:#8b6914;letter-spacing:0.15em;text-transform:uppercase;padding:0.7rem 0.8rem;text-align:left;border-bottom:1px solid #c9a84c55}
td{padding:0.55rem 0.8rem;border-bottom:1px dotted #c9a84c33;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf7f0}
.td-seccion{font-family:'Cinzel',serif;font-size:0.75rem;color:#8b6914;letter-spacing:0.1em}
.td-nombre{font-style:italic}
.td-precio{font-family:'Cinzel',serif;font-weight:600;color:#4a2c0a;text-align:right}
.td-actions{text-align:right;white-space:nowrap}

/* Inline edit */
.edit-input{padding:0.3rem 0.5rem;border:1px solid #8b6914;border-radius:4px;font-size:0.95rem;font-family:inherit;background:#faf7f0;color:#2a1f0e;outline:none}
.edit-input.precio{width:80px;text-align:right}
.edit-input.nombre{width:100%}

/* Buttons */
.btn-icon{background:none;border:none;cursor:pointer;padding:0.25rem 0.4rem;border-radius:4px;font-size:0.82rem;font-family:'Cinzel',serif;letter-spacing:0.05em}
.btn-edit{color:#185fa5}
.btn-edit:hover{background:#e6f1fb}
.btn-save{color:#0f6e56}
.btn-save:hover{background:#e1f5ee}
.btn-cancel{color:#6b4f2a}
.btn-cancel:hover{background:#f0e8d0}
.btn-del{color:#a32d2d}
.btn-del:hover{background:#fcebeb}
.btn-del:disabled{opacity:0.4;cursor:not-allowed}

/* Toast */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#4a2c0a;color:#f5f0e8;font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.1em;padding:0.7rem 1.3rem;border-radius:8px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
#toast.err{background:#791f1f}

.loading-msg{text-align:center;padding:2rem;font-family:'Cinzel',serif;color:#8b6914;letter-spacing:0.2em;font-size:0.85rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-title">La Cabaña</div>
    <div class="login-sub">Panel de Administración</div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="inp-user" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="inp-pass" placeholder="Contraseña" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login-submit">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="admin-header">
    <div>
      <div class="admin-title">Panel de Administración</div>
      <div class="admin-sub">Mesón · Restaurante La Cabaña</div>
    </div>
    <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
  </div>

  <!-- ADD -->
  <div class="add-form">
    <div class="add-form-title">Añadir nuevo producto</div>
    <div class="form-row">
      <div class="form-group">
        <label>Sección</label>
        <select id="new-seccion">
          <option>Entrantes y Primeros</option>
          <option>Pescados</option>
          <option>Carnes</option>
          <option>Bocadillos</option>
          <option>Pizzas</option>
          <option>Patatas</option>
          <option>Postres</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="new-nombre" placeholder="Nombre del producto">
      </div>
      <div class="form-group">
        <label>Precio (€)</label>
        <input type="number" id="new-precio" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button class="btn-add" id="btn-add">+ Añadir</button>
      </div>
    </div>
  </div>

  <!-- FILTER + TABLE -->
  <div class="filter-row">
    <select id="filter-seccion">
      <option value="">Todas las secciones</option>
      <option>Entrantes y Primeros</option>
      <option>Pescados</option>
      <option>Carnes</option>
      <option>Bocadillos</option>
      <option>Pizzas</option>
      <option>Patatas</option>
      <option>Postres</option>
    </select>
    <span class="count-badge" id="count-badge"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Sección</th>
          <th>Nombre</th>
          <th style="text-align:right">Precio</th>
          <th style="text-align:right">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr><td colspan="4" class="loading-msg">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://ycevaztpxjfnbwjmojhx.supabase.co'
const SUPABASE_KEY = 'sb_publishable_qVRqDvEojdSXXFogpx6iHA_oDn1L0R1'
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

let allItems = []
let editingId = null

// --- UTILS ---
function toast(msg, err=false) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'show' + (err?' err':'')
  clearTimeout(t._t)
  t._t = setTimeout(() => t.className='', 2800)
}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')
}

// --- AUTH ---
document.getElementById('inp-pass').addEventListener('keydown', e => {
  if(e.key==='Enter') document.getElementById('btn-login-submit').click()
})

document.getElementById('btn-login-submit').addEventListener('click', async () => {
  const user = document.getElementById('inp-user').value.trim()
  const pass = document.getElementById('inp-pass').value
  const errEl = document.getElementById('login-err')
  errEl.textContent = ''
  if(!user||!pass){errEl.textContent='Rellena todos los campos.';return}
  const hash = await sha256(pass)
  const {data,error} = await sb.from('admin_users').select('id').eq('username',user).eq('password_hash',hash).maybeSingle()
  if(error||!data){errEl.textContent='Usuario o contraseña incorrectos.';return}
  sessionStorage.setItem('admin_ok','1')
  showAdmin()
})

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('admin_ok')
  document.getElementById('admin-screen').style.display='none'
  document.getElementById('login-screen').style.display='flex'
})

function showAdmin() {
  document.getElementById('login-screen').style.display='none'
  document.getElementById('admin-screen').style.display='block'
  loadCarta()
}

if(sessionStorage.getItem('admin_ok')==='1') showAdmin()

// --- LOAD ---
async function loadCarta() {
  const {data,error} = await sb.from('carta').select('*').order('id')
  if(error){toast('Error al cargar la carta',true);return}
  allItems = data
  renderTabla()
}

// --- RENDER ---
function renderTabla() {
  const filtro = document.getElementById('filter-seccion').value
  const items = filtro ? allItems.filter(i=>i.seccion===filtro) : allItems
  document.getElementById('count-badge').textContent = items.length + ' productos'
  const tbody = document.getElementById('tabla-body')
  if(!items.length){tbody.innerHTML='<tr><td colspan="4" class="loading-msg">Sin productos</td></tr>';return}
  tbody.innerHTML = items.map(item => {
    if(editingId===item.id) return rowEdit(item)
    return rowView(item)
  }).join('')
  bindRowEvents()
}

function rowView(item) {
  const precio = item.precio!=null ? Number(item.precio).toFixed(2).replace('.',',')+'&nbsp;€' : '—'
  return `<tr data-id="${item.id}">
    <td class="td-seccion">${item.seccion}</td>
    <td class="td-nombre">${item.nombre}${item.descripcion?`<span class="item-desc" style="font-size:0.8rem;color:#6b4f2a;display:block">${item.descripcion}</span>`:''}</td>
    <td class="td-precio">${precio}</td>
    <td class="td-actions">
      <button class="btn-icon btn-edit" data-id="${item.id}">Editar</button>
      <button class="btn-icon btn-del" data-id="${item.id}">Eliminar</button>
    </td>
  </tr>`
}

function rowEdit(item) {
  return `<tr data-id="${item.id}" style="background:#fffdf5">
    <td class="td-seccion">
      <select class="edit-input" id="edit-sec-${item.id}" style="width:100%">
        ${['Entrantes y Primeros','Pescados','Carnes','Bocadillos','Pizzas','Patatas','Postres']
          .map(s=>`<option${s===item.seccion?' selected':''}>${s}</option>`).join('')}
      </select>
    </td>
    <td><input class="edit-input nombre" id="edit-nom-${item.id}" value="${item.nombre}"></td>
    <td><input class="edit-input precio" id="edit-pre-${item.id}" type="number" step="0.01" min="0" value="${item.precio??''}"></td>
    <td class="td-actions">
      <button class="btn-icon btn-save" data-id="${item.id}">Guardar</button>
      <button class="btn-icon btn-cancel" data-id="${item.id}">Cancelar</button>
    </td>
  </tr>`
}

function bindRowEvents() {
  document.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => {
    editingId = parseInt(b.dataset.id); renderTabla()
  }))
  document.querySelectorAll('.btn-cancel').forEach(b => b.addEventListener('click', () => {
    editingId = null; renderTabla()
  }))
  document.querySelectorAll('.btn-save').forEach(b => b.addEventListener('click', () => saveEdit(parseInt(b.dataset.id))))
  document.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => deleteItem(parseInt(b.dataset.id))))
}

// --- SAVE EDIT ---
async function saveEdit(id) {
  const nom = document.getElementById(`edit-nom-${id}`).value.trim()
  const pre = document.getElementById(`edit-pre-${id}`).value
  const sec = document.getElementById(`edit-sec-${id}`).value
  if(!nom){toast('El nombre no puede estar vacío',true);return}
  const precio = pre==='' ? null : parseFloat(pre)
  const {error} = await sb.from('carta').update({nombre:nom,precio,seccion:sec}).eq('id',id)
  if(error){toast('Error al guardar',true);return}
  const idx = allItems.findIndex(i=>i.id===id)
  if(idx>-1) allItems[idx]={...allItems[idx],nombre:nom,precio,seccion:sec}
  editingId = null
  renderTabla()
  toast('Producto actualizado')
}

// --- DELETE ---
async function deleteItem(id) {
  if(!confirm('¿Eliminar este producto de la carta?')) return
  const {error} = await sb.from('carta').delete().eq('id',id)
  if(error){toast('Error al eliminar',true);return}
  allItems = allItems.filter(i=>i.id!==id)
  renderTabla()
  toast('Producto eliminado')
}

// --- ADD ---
document.getElementById('btn-add').addEventListener('click', async () => {
  const sec = document.getElementById('new-seccion').value
  const nom = document.getElementById('new-nombre').value.trim()
  const pre = document.getElementById('new-precio').value
  if(!nom){toast('Escribe el nombre del producto',true);return}
  const precio = pre==='' ? null : parseFloat(pre)
  const btn = document.getElementById('btn-add')
  btn.disabled = true
  const {data,error} = await sb.from('carta').insert({seccion:sec,nombre:nom,precio}).select().single()
  btn.disabled = false
  if(error){toast('Error al añadir',true);return}
  allItems.push(data)
  document.getElementById('new-nombre').value=''
  document.getElementById('new-precio').value=''
  renderTabla()
  toast('Producto añadido')
})

// --- FILTER ---
document.getElementById('filter-seccion').addEventListener('change', renderTabla)
</script>
</body>
</html>
